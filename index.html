<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283b"><title>台股 AI 投資研究室</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#eef3f7;font:16px system-ui,'Microsoft JhengHei',sans-serif;color:#162d3d}header{background:#10283b;color:white;padding:24px 18px}header h1{margin:0;font-size:24px}header p{color:#c2d6e1;margin:7px 0 0}.wrap{max-width:950px;margin:auto;padding:18px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.tabs button{white-space:nowrap}button{background:#147e91;color:white;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:600}button.alt{background:#dce9ee;color:#163748}.panel{background:white;border-radius:15px;padding:20px;margin:10px 0;box-shadow:0 3px 14px #173b5010}h2{margin-top:0;font-size:21px}input,textarea,select{padding:11px;border:1px solid #b9cbd4;border-radius:9px;box-sizing:border-box;width:100%;font:inherit}label{display:block;margin:9px 0 5px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{background:#f0f6f8;border-radius:12px;padding:15px;text-align:left;color:#15394a}.tile small{display:block;margin-top:7px;color:#4e6c78}.muted{color:#5b7180;font-size:13px}.result{background:#e8f5f2;padding:14px;border-radius:10px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.row>*:first-child{flex:1}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #dde8ee;text-align:left;padding:9px}#content{min-height:330px}footer{text-align:center;padding:18px;color:#71838c;font-size:12px}</style></head><body><header><div class="wrap"><h1>📈 台股 AI 投資研究室</h1><p>8 大研究工具 · 個股分析 · 風險管理 · 交易檢討</p></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section id="content"></section></main><footer>研究用途，非投資建議｜不提供未經查證的即時報價｜資料僅儲存於本機瀏覽器</footer><script>
const features=[['潛力股篩選','檢查營收年增、EPS、毛利率、營益率、負債與現金流'],['個股價值分析','研究四季財報、估值、產品、客戶產業、競爭優勢與風險'],['產業競爭比較','比較3至5家同業的營收成長、獲利與競爭地位'],['大盤分析','觀察加權指數、成交量、三大法人與權值股'],['股價上漲原因','區分財報支撐、公告事實、推論與市場傳聞'],['進出場風險','依資金、預計買價及停損價試算部位'],['交易紀錄檢討','統計已完成交易的勝率、平均損益與交易錯誤'],['每日自選股','儲存5至10檔候選股及研究備註']];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let page='首頁';const tabs=['首頁','自選股','風控試算','交易紀錄'];function el(id){return document.getElementById(id)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(p){page=p;render()}function render(){el('tabs').innerHTML=tabs.map(t=>`<button class="${page===t?'':'alt'}" onclick="nav('${t}')">${t}</button>`).join('');if(page==='首頁')home();else if(page==='自選股')watch();else if(page==='風控試算')risk();else if(page==='交易紀錄')trades();else feature(+page.split(':')[1]);}
function home(){el('content').innerHTML=`<div class="panel"><h2>股票研究入口</h2><label>股票代號</label><div class="row"><input id="stock" value="2484" placeholder="例如 2484"><button onclick="featureGo(1)">分析股票</button></div><p class="muted">預設為希華（2484）。AI 查詢需開啟 ChatGPT 並確認最新公開資料。</p></div><div class="grid">${features.map((f,i)=>`<button class="tile" onclick="nav('功能:${i}')"><b>${i+1}. ${f[0]}</b><small>${f[1]}</small></button>`).join('')}</div>`}function featureGo(i){let v=el('stock')?.value.trim();if(v)localStorage.setItem('stockcode',v);nav('功能:'+i)}function feature(i){const f=features[i];el('content').innerHTML=`<div class="panel"><button class="alt" onclick="nav('首頁')">← 返回</button><h2>${i+1}. ${f[0]}</h2><p>${f[1]}</p><label>股票代號／產業名稱</label><input id="q" value="${esc(localStorage.getItem('stockcode')||'2484')}"/><div class="row"><button onclick="ai(${i})">使用 ChatGPT 查證研究</button>${i===5?'<button class="alt" onclick="nav(\'風控試算\')">風險試算</button>':''}${i===6?'<button class="alt" onclick="nav(\'交易紀錄\')">交易紀錄</button>':''}${i===7?'<button class="alt" onclick="nav(\'自選股\')">自選股</button>':''}</div><p class="muted">此按鈕會開啟 ChatGPT 並複製研究指令；請在 ChatGPT 對話中貼上送出。查證時應標明日期與來源，避免編造數據。</p></div>`}async function ai(i){let q=el('q').value.trim();localStorage.setItem('stockcode',q);let prompt=`請依台股 AI 投資研究室「${features[i][0]}」分析 ${q}。${features[i][1]}。請查證最新公開資訊，列出資料日期與來源，區分確認事實、推論及未證實消息，不要編造數字。`;try{await navigator.clipboard.writeText(prompt);alert('研究指令已複製，請在開啟的 ChatGPT 中貼上。')}catch{prompt('請複製研究指令：',prompt)}window.open('https://chatgpt.com/','_blank')}
function watch(){let w=get('watch',[{code:'2484',note:'希華：追蹤季度毛利率、高頻產品出貨與估值'}]);el('content').innerHTML=`<div class="panel"><h2>我的自選股（${w.length}/10）</h2><div class="row"><input id="wc" placeholder="股票代號，例如 2330"><button onclick="addWatch()">新增</button></div><label>研究備註</label><textarea id="wn" rows="2" placeholder="例如：追蹤營收及毛利率"></textarea>${w.map((x,i)=>`<div class="panel" style="background:#f4f8fa"><b>${esc(x.code)}</b><p>${esc(x.note)}</p><button class="alt" onclick="removeWatch(${i})">移除</button></div>`).join('')}</div>`}function addWatch(){let w=get('watch',[{code:'2484',note:'希華：追蹤季度毛利率、高頻產品出貨與估值'}]),code=el('wc').value.trim();if(!code)return alert('請輸入股票代號');if(w.length>=10)return alert('最多10檔');if(w.some(x=>x.code===code))return alert('已在清單');w.push({code,note:el('wn').value});put('watch',w);watch()}function removeWatch(i){let w=get('watch',[{code:'2484',note:'希華：追蹤季度毛利率、高頻產品出貨與估值'}]);w.splice(i,1);put('watch',w);watch()}
function risk(){el('content').innerHTML=`<div class="panel"><h2>進出場風險試算</h2><div class="grid"><div><label>可用資金（元）</label><input type="number" id="capital" value="100000"></div><div><label>單筆最大風險（%）</label><input type="number" id="pct" value="2"></div><div><label>預計買價（元）</label><input type="number" id="buy" value="50"></div><div><label>預設停損價（元）</label><input type="number" id="stop" value="47"></div></div><button style="margin-top:15px" onclick="calc()">計算部位</button><div id="riskout"></div><p class="muted">以整張1000股估算，未計手續費、稅金、滑價及跳空風險；停損不保證成交。</p></div>`}function calc(){let c=+el('capital').value,p=+el('pct').value,b=+el('buy').value,s=+el('stop').value;if(!(c>0&&p>0&&p<=100&&b>s&&s>=0))return el('riskout').innerHTML='<p>請確認資金、風險比例及買價大於停損價。</p>';let loss=c*p/100,shares=Math.floor(Math.min(loss/(b-s),c/b)/1000)*1000;el('riskout').innerHTML=`<div class="result">可承受虧損：<b>${loss.toLocaleString()} 元</b><br>估計整張股數：<b>${shares.toLocaleString()} 股</b><br>預估投入：${(shares*b).toLocaleString()} 元<br>停損價差損失：${(shares*(b-s)).toLocaleString()} 元</div>`}
function trades(){let t=get('trades',[]),wins=t.filter(x=>x.pnl>0),loss=t.filter(x=>x.pnl<0),sum=t.reduce((a,x)=>a+x.pnl,0),avg=a=>a.length?a.reduce((v,x)=>v+x.pnl,0)/a.length:0;el('content').innerHTML=`<div class="panel"><h2>交易紀錄檢討</h2><div class="grid"><div><label>股票代號</label><input id="tc" placeholder="2484"></div><div><label>股數</label><input id="tq" type="number" value="1000"></div><div><label>買入價格</label><input id="tb" type="number"></div><div><label>賣出價格</label><input id="ts" type="number"></div></div><label>交易理由與檢討</label><textarea id="tn" rows="2"></textarea><button onclick="addTrade()">新增已完成交易</button><div class="result">筆數：${t.length} ｜ 勝率：${t.length?(wins.length/t.length*100).toFixed(1)+'%':'—'}<br>價差損益：${sum.toFixed(0)} 元<br>平均獲利：${avg(wins).toFixed(0)} 元 ｜ 平均虧損：${avg(loss).toFixed(0)} 元</div><div style="overflow:auto"><table><tr><th>股票</th><th>股數</th><th>價差損益</th><th>操作</th></tr>${t.map((x,i)=>`<tr><td>${esc(x.code)}<br><small>${esc(x.note)}</small></td><td>${x.qty}</td><td>${x.pnl.toFixed(0)}</td><td><button class="alt" onclick="removeTrade(${i})">刪除</button></td></tr>`).join('')}</table></div><p class="muted">損益未扣手續費及稅金。資料儲存在目前瀏覽器，清除網站資料可能遺失。</p><button class="alt" onclick="exportData()">匯出備份 JSON</button></div>`}function addTrade(){let code=el('tc').value.trim(),qty=+el('tq').value,b=+el('tb').value,s=+el('ts').value;if(!code||!(qty>0&&b>0&&s>0))return alert('請完整輸入交易資料');let t=get('trades',[]);t.push({code,qty,buy:b,sell:s,pnl:(s-b)*qty,note:el('tn').value});put('trades',t);trades()}function removeTrade(i){if(!confirm('確定刪除這筆紀錄？'))return;let t=get('trades',[]);t.splice(i,1);put('trades',t);trades()}function exportData(){let data=JSON.stringify({watch:get('watch',[]),trades:get('trades',[])},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='台股研究室備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></body></html>
